<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>設定 | ローカル・ルーラー</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="app-header">
        <div class="container">
            <div class="logo"><a href="index.html">ローカル・ルーラー</a></div>
            <button class="mobile-menu-toggle" aria-label="メニューを開く">
                 <i class="fas fa-bars"></i>
            </button>
            <nav class="main-nav">
                <ul>
                    <li><a href="dashboard.html">ダッシュボード</a></li>
                    <li><a href="data.html">地域データ</a></li>
                    <li><a href="cases.html">事例検索</a></li>

                    <li><a href="settings.html" class="active">設定</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <h2>設定</h2>
            <div class="card">
                <h3>プロジェクト設定</h3>
                <div class="form-group">
                    <label for="projectName">プロジェクト名:</label>
                    <input type="text" id="projectName" class="form-control" value="[プロジェクト名]">
                </div>
                <div class="form-group">
                    <label for="targetArea">分析対象地域:</label>
                    <input type="text" id="targetArea" class="form-control" value="〇〇市">
                </div>
                <button class="btn">設定を保存</button>
            </div>
            <div class="card">
                <h3>プロジェクトの削除</h3>
                <p>このプロジェクトを削除すると、関連するすべてのデータが失われます。この操作は元に戻せません。</p>
                <button class="btn" style="background-color:#dc3545;">プロジェクトを削除する</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 ローカル・ルーラー</p>
