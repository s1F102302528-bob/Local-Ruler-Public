<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>ArcGIS タイルレイヤー表示</title>
  <link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/light/main.css">
  <script src="https://js.arcgis.com/4.29/"></script>
  <style>
    #mapContainer {
      width: 100%;
      height: 600px;
    }
    #viewDiv, #viewDiv1, #viewDiv2 {
      height: 600px;
    }
    #viewDiv1, #viewDiv2 {
      width: 50%;
      float: left;
    }
    .controls {
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h1>年度別 ArcGIS タイルレイヤー</h1>

  <!-- 操作ボタン -->
  <div class="controls">
    <button onclick="loadMap('{{ tilelayers.2010 }}')">2010年度</button>
    <button onclick="loadMap('{{ tilelayers.2015 }}')">2015年度</button>
    <button onclick="loadMap('{{ tilelayers.2020 }}')">2020年度</button>
    <button onclick="showCompare('{{ tilelayers.2010 }}','{{ tilelayers.2015 }}')">2010 vs 2015</button>
    <button onclick="showCompare('{{ tilelayers.2015 }}','{{ tilelayers.2020 }}')">2015 vs 2020</button>
    <button onclick="showCompare('{{ tilelayers.2010 }}','{{ tilelayers.2020 }}')">2010 vs 2020</button>
  </div>

  <!-- マップ表示領域 -->
  <div id="mapContainer">
    <div id="viewDiv"></div>
  </div>

  <script>
    require(["esri/Map", "esri/views/MapView", "esri/layers/TileLayer"], 
      function(Map, MapView, TileLayer) {
        let view;

        // 単一マップを読み込む関数
        window.loadMap = function(tileUrl) {
          const layer = new TileLayer({ url: tileUrl });
          const map = new Map({
            basemap: "streets",
            layers: [layer]
          });

          if (!view) {
            view = new MapView({
              container: "viewDiv",
              map: map,
              center: [139.7, 35.7], // 東京付近の座標例
              zoom: 10
            });
          } else {
            view.map = map;
          }
        }

        // 比較モード表示
        window.showCompare = function(url1, url2) {
          document.getElementById("mapContainer").innerHTML = `
            <div id="viewDiv1"></div>
            <div id="viewDiv2"></div>
          `;

          const layer1 = new TileLayer({ url: url1 });
          const layer2 = new TileLayer({ url: url2 });

          const map1 = new Map({ basemap: "streets", layers: [layer1] });
          const map2 = new Map({ basemap: "streets", layers: [layer2] });

          new MapView({
            container: "viewDiv1",
            map: map1,
            center: [139.7, 35.7],
            zoom: 10
          });

          new MapView({
            container: "viewDiv2",
            map: map2,
            center: [139.7, 35.7],
            zoom: 10
          });
        }

        // 初期表示（例: 2020年度）
        loadMap("{{ tilelayers.2020 }}");
    });
  </script>
</body>
</html>
