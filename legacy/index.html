<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ローカル・ルーラー - 地域創生プロジェクトを「わかる」へ</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="ruler-bg-deco">
        <div class="ruler-line line1"></div>
        <div class="ruler-line line2"></div>
        <div class="ruler-line line3"></div>
    </div>

    <div class="top-page-wrapper">
        <div class="container top-page-container">
            <div style="font-size: 3rem; color: var(--primary-color); margin-bottom: 10px;">
                <i class="fas fa-ruler-combined"></i>
            </div>
            <h1>ローカル・ルーラー</h1>
            <p class="tagline">
                地方創生プロジェクトを<br>
                「わからない」から<span>「わかる」</span>へまっすぐ。
            </p>
            <p style="font-size: 0.9em; color: #666; margin-bottom: 30px;">
                地域特性の統計分析と成功事例の傾向一致度スコアで、<br>
                あなたの街に最適な解決策を製図します。
            </p>
            <form action="dashboard.html" method="get">
                <div class="form-group">
                    <input type="text" name="projectName" class="form-control" placeholder="プロジェクト名を入力" required style="text-align: center;">
                </div>
                <button type="submit" class="btn" style="width: 100%;">
                    <i class="fas fa-pen-ruler"></i> プロジェクトを設計する
                </button>
            </form>
        </div>
    </div>
</body>
</html>
